[package]
name = "scroll-shot"
version = "0.3.0"
edition = "2021"
description = "Ultra-lightweight, high-resolution, pixel-perfect scrolling screenshot and desktop pinning tool for Linux"
license = "MIT"
repository = "https://github.com/ephmYZnq/scroll-shot"
readme = "README.md"
keywords = ["screenshot", "scrolling-screenshot", "ocr", "x11", "wayland"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
x11rb = { version = "0.13", features = ["xtest", "shm"] }
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
libc = "0.2"
