name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Binary
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxtst-dev libfreetype6-dev tesseract-ocr tesseract-ocr-chi-sim

    - name: Set up Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build Release Binary
      run: cargo build --release

    - name: Package Release Assets
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        PKG_NAME="scroll-shot-${TAG_NAME}-linux-x86_64"
        mkdir -p "${PKG_NAME}"
        cp target/release/scroll-shot "${PKG_NAME}/"
        cp setup_hotkey.sh "${PKG_NAME}/"
        cp scroll-shot.desktop "${PKG_NAME}/"
        cp README.md "${PKG_NAME}/"
        cp README_zh.md "${PKG_NAME}/"
        cp LICENSE "${PKG_NAME}/"
        chmod +x "${PKG_NAME}/scroll-shot"
        chmod +x "${PKG_NAME}/setup_hotkey.sh"

        tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
        sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          scroll-shot-*-linux-x86_64.tar.gz
          scroll-shot-*-linux-x86_64.tar.gz.sha256
